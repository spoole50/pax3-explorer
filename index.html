<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1716" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ember · PAX 3 remote</title>
<style>
:root {
  --bg: #fff6ef;
  --card: #fff;
  --ink: #3b2a2a;
  --muted: #9a8580;
  --line: #f3e6dd;
  --accent: #ff8a65;
  --accent-ink: #fff;
  --ok: #3fae86;
  --ok-bg: #d9f5ea;
  --ok-ink: #1f7a57;
  --cool: #8fa6cf;
  --shadow: 0 6px 22px rgba(120, 60, 40, .08);
  --arc: var(--accent);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1716;
    --card: #2a2120;
    --ink: #f6e9e3;
    --muted: #b09a93;
    --line: #3a2f2d;
    --ok-bg: #1d3a30;
    --ok-ink: #7fdcb6;
    --shadow: 0 6px 22px rgba(0, 0, 0, .3);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 420px; margin: 0 auto; }

/* Header */
header { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 16px; }
h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
.pills { display: flex; gap: 6px; }
.pill { font-size: 13px; padding: 5px 11px; border-radius: 99px; background: var(--line); color: var(--muted); white-space: nowrap; transition: background .2s, color .2s; }
.pill.on { background: var(--ok-bg); color: var(--ok-ink); }

/* Cards */
.card { background: var(--card); border-radius: 26px; padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
.controls { transition: opacity .3s; }
body:not(.connected) .controls { opacity: .45; pointer-events: none; }

/* Temperature ring */
.ring { position: relative; width: 220px; height: 220px; margin: 4px auto 0; transition: opacity .6s; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .arc { stroke: var(--arc); transition: stroke-dashoffset .6s, stroke .3s; }
.ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.big { font-size: 58px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; transition: color .6s; }
.big small { font-size: 24px; font-weight: 600; vertical-align: top; margin-left: 2px; }
.sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
.state { text-align: center; margin-top: 12px; font-weight: 600; min-height: 1.35em; transition: opacity .15s; }

.ring.heat { --arc: var(--accent); }
.ring.heat svg { animation: glow 1.4s ease-in-out infinite; }
.ring.heat .big { animation: breathe 1.4s ease-in-out infinite; }
.ring.ok { --arc: #5cc8a1; animation: pop .5s ease-out; }
.ring.ok svg { filter: drop-shadow(0 0 10px rgba(92, 200, 161, .55)); }
.ring.ok .big { color: var(--ok); }
.ring.cool { --arc: #9fb4d9; opacity: .7; }
.ring.cool .big { color: var(--cool); }
@keyframes glow { 0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 138, 101, 0)); } 50% { filter: drop-shadow(0 0 14px rgba(255, 138, 101, .7)); } }
@keyframes breathe { 50% { transform: scale(1.05); } }
@keyframes pop { 40% { transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .ring, .ring * { animation: none !important; } }

/* Rows & inputs */
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.row + .row, .row + input, input + .row { margin-top: 14px; }
.label b { font-variant-numeric: tabular-nums; }
.hint { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
input[type=range] { width: 100%; height: 32px; margin: 6px 0 0; accent-color: var(--accent); }

.chips { display: flex; gap: 8px; margin-top: 12px; }
.chip { flex: 1; border: 0; border-radius: 16px; padding: 10px 4px; background: var(--line); font-size: 12px; color: var(--muted); transition: background .15s, color .15s, transform .1s; }
.chip b { display: block; font-size: 16px; color: var(--ink); }
.chip:active { transform: scale(.96); }
.chip.active { background: var(--accent); color: var(--accent-ink); }
.chip.active b { color: var(--accent-ink); }
.swatch { display: block; width: 22px; height: 22px; margin: 0 auto 4px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line); }

.btn { display: block; width: 100%; border: 0; border-radius: 20px; padding: 17px; font-size: 17px; font-weight: 600; background: var(--accent); color: var(--accent-ink); transition: transform .1s, filter .15s, background .2s; }
.btn:active { transform: scale(.98); filter: brightness(.95); }
.btn.secondary { background: var(--line); color: var(--ink); }
.btn:disabled { opacity: .6; }

/* iOS-style switch */
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: .2s; }
.switch span::before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::before { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Developer panel */
.devtoggle { margin: 20px 6px 10px; }
#dev[hidden] { display: none; }
#dev input[type=text] { font: inherit; font-family: ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 130px; }
#dev .chip { color: var(--ink); font-size: 13px; }
#log { white-space: pre-wrap; word-break: break-all; font: 11px/1.45 ui-monospace, monospace; max-height: 280px; overflow: auto; background: var(--line); border-radius: 12px; padding: 8px 10px; margin-top: 12px; }
#log:empty::before { content: "No messages yet"; color: var(--muted); }

/* Session stats */
.stats { display: flex; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.stat { flex: 1; text-align: center; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.live b { color: var(--accent); }

/* Presets: long-press to save */
#presets .chip { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
#presets .chip.saving { animation: saving .55s linear forwards; }
@keyframes saving { to { transform: scale(.9); box-shadow: inset 0 0 0 2px var(--accent); } }
.chips + .hint { text-align: center; margin-top: 10px; }

.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Attribute explorer */
.section { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 6px; }
#attrs { width: 100%; border-collapse: collapse; font: 11px/1.4 ui-monospace, monospace; }
#attrs td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: top; }
#attrs td:first-child { width: 2.5em; color: var(--muted); }
#attrs td:nth-child(2) { font-family: -apple-system, system-ui, sans-serif; font-size: 12px; }
#attrs td:nth-child(3) { word-break: break-all; }
#attrs td:last-child { text-align: right; white-space: nowrap; color: var(--muted); }
#attrs tr.changed td { background: rgba(255, 138, 101, .22); transition: none; }
#attrs tr td { transition: background 1.5s; }
#attrs .guess { color: var(--muted); }
#attrs .hint { margin-top: 1px; }
#attrs:empty::after { content: "Connect to see attributes"; display: block; color: var(--muted); padding: 6px 0; font-family: -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Ember 🔥</h1>
    <div class="pills">
      <span class="pill" id="batt">🔋 –</span>
      <span class="pill" id="conn">Offline</span>
    </div>
  </header>

  <div class="card">
    <div class="ring" id="ring">
      <svg width="220" height="220" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="track" cx="110" cy="110" r="96" fill="none" stroke-width="14"/>
        <circle class="arc" id="arc" cx="110" cy="110" r="96" fill="none" stroke-width="14"
                stroke-linecap="round" stroke-dasharray="603" stroke-dashoffset="603"/>
      </svg>
      <div class="c">
        <div class="big" id="live">–</div>
        <div class="sub">target <span id="tgt">–</span>°F</div>
      </div>
    </div>
    <div class="state" id="state" aria-live="polite">Not connected</div>
    <div class="stats">
      <div class="stat" id="sessStat"><b id="sess">–</b><span id="sessLbl">Session</span></div>
      <div class="stat"><b id="heat">–</b><span>Heat-up</span></div>
      <div class="stat"><b id="draws">–</b><span>Draws</span></div>
    </div>
  </div>

  <div class="card controls">
    <div class="row label"><span>Temperature</span><b><span id="setv">380</span>°F</b></div>
    <input type="range" id="temp" min="341" max="420" value="380" aria-label="Temperature">
    <div class="chips" id="presets">
      <button class="chip"><b></b>Flavor</button>
      <button class="chip"><b></b>Balanced</button>
      <button class="chip"><b></b>Cloudy</button>
      <button class="chip"><b></b>Max</button>
    </div>
    <span class="hint">Press and hold a preset to save the current temp</span>
  </div>

  <div class="card controls">
    <label class="row">
      <span>Hold temp between draws<span class="hint">Off = battery-saving cool-down &amp; sleep</span></span>
      <span class="switch"><input type="checkbox" id="hold"><span></span></span>
    </label>
    <div class="row"><span>LED brightness</span></div>
    <input type="range" id="bright" min="0" max="100" value="100" aria-label="LED brightness">
    <div class="row"><span>LED colors</span></div>
    <div class="chips" id="themes"></div>
  </div>

  <button class="btn" id="connect">Connect</button>

  <label class="row devtoggle">
    <span class="hint">Developer mode</span>
    <span class="switch"><input type="checkbox" id="devmode"><span></span></span>
  </label>

  <div class="card" id="dev" hidden>
    <div class="row">
      <span>Serial<span class="hint">8 characters, on the device</span></span>
      <input type="text" id="serial" maxlength="8" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="section">Attributes</div>
    <label class="row">
      <span>Live poll<span class="hint" id="pollStatus">Off</span></span>
      <span class="switch"><input type="checkbox" id="poll" autocomplete="off"><span></span></span>
    </label>
    <div class="chips">
      <button class="chip" id="status">Request status</button>
      <button class="chip" id="scan">Request IDs 1–40</button>
    </div>
    <table id="attrs"></table>

    <div class="section">Log</div>
    <div class="chips">
      <button class="chip" id="mark">Mark</button>
      <button class="chip" id="pause">Pause</button>
      <button class="chip" id="clear">Clear</button>
      <button class="chip" id="copy">Copy all</button>
    </div>
    <div id="log"></div>
    <div class="chips"><button class="chip" id="resetPresets">Reset presets</button></div>
  </div>

  <div class="toast" id="toast" role="status"></div>

</div>
<script>
const SERIAL = ''; // your 8-character serial, or leave blank and set it in Developer mode

// ---- PAX 3 protocol ----
const SVC      = '8e320200-64d2-11e6-bdf4-0800200c9a66';
const C_READ   = '8e320201-64d2-11e6-bdf4-0800200c9a66';
const C_WRITE  = '8e320202-64d2-11e6-bdf4-0800200c9a66';
const C_NOTIFY = '8e320203-64d2-11e6-bdf4-0800200c9a66';
const MASTER   = hex('F7C866C38F78753086293BD57DD32540');
const BITS     = [1, 2, 3, 6, 7, 9, 13, 15, 17, 19, 20, 21, 23, 27, 28, 31, 32];
const PROFILE  = [1600, 30, 150, 20, 30, 180, 39, 2300, 1990, 20];
const STATES = {
  0: ['Heating up…', 'heat'],
  1: ['Ready ✨', 'ok'],
  2: ['Drawing', 'heat'],
  3: ['Cooling down', 'cool'],
  4: ['Sleeping 💤', 'cool'],
  5: ['Oven off', 'cool'],
  6: ['Setting temp', 'heat'],
};
// Known attribute IDs; `true` marks a name that's a guess, not yet confirmed on a PAX 3.
const ATTRS = {
  1: ['Live temp'], 2: ['Set point'], 3: ['Battery'], 4: ['Usage', true], 6: ['Locked'],
  7: ['Charge status'], 8: ['Pod inserted', true], 9: ['Uptime'], 17: ['Temp levels'],
  19: ['Dynamic mode'], 20: ['Color theme'], 21: ['Brightness'], 23: ['Haptic mode', true],
  24: ['Supported attributes'], 25: ['Heating params'], 27: ['UI mode'], 28: ['Shell color', true],
  30: ['Low battery mode', true], 31: ['Active target'], 32: ['Heating state'],
};
// Official app color themes (via github.com/290asd/pax3-web). Each is 4 states (startup, heating,
// regulating, standby) of 8 bytes: r1 g1 b1 r2 g2 b2 animation frequency. null = stock LEDs (UI mode 0).
const THEMES = [
  ['Default', null],
  ['Ocean',  '0000ff006c750011 1307282800ff0010 245c430000ff0209 0014140000ff0106'],
  ['Sunset', 'ff73289900680105 ff7328990068000f fd9528990088020b ff727d00409a0106'],
  ['Mars',   'fa00003c1400021b ff00000302010011 ff16030302010209 fa1e0a040f0c0107'],
].map(([name, h]) => [name, h && hex(h.replace(/ /g, ''))]);
const DEFAULT_PRESETS = [360, 380, 400, 420];
const fmtTime = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let keyObj, device, rd, wr;
let chain = Promise.resolve();
let want = false, retries = 0, dragging = false;
let live = null, target = null, heatState = null, battery = null, charging = false;
let presets = loadPresets();
let pollTimer = null, attrsQueued = false;
const lines = [];
let logPaused = false, marks = 0;
const pollStats = { replies: 0, changes: 0, lastAt: 0 };
const attrs = {}; // id -> { hex, at, changedAt }
// Session = from first reaching Ready until the device sleeps or turns off.
const session = { heatStart: null, readyAt: null, heatSecs: null, draws: 0, lastMs: null };

// ---- Helpers ----
function hex(s) { return new Uint8Array(s.match(/../g).map(h => parseInt(h, 16))); }
function toHex(b) { return [...b].map(x => x.toString(16).padStart(2, '0')).join(' '); }

function renderLog() {
  if (!$('devmode').checked) return;
  $('log').textContent = lines.join('\n');
  $('log').scrollTop = 1e9;
}
function log(m, force) {
  if (logPaused && !force) return;
  lines.push(new Date().toLocaleTimeString() + '  ' + m);
  if (lines.length > 1000) lines.shift();
  renderLog();
}

// Queue work so BLE reads/writes never overlap; a failure never jams the queue.
function enqueue(fn) {
  chain = chain.then(fn).catch(e => log('error: ' + e));
}

// ---- Crypto (AES-128-OFB keyed by serial) ----
const importKey = raw => crypto.subtle.importKey('raw', raw, 'AES-CBC', false, ['encrypt']);
async function aesBlock(k, b) {
  return new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-CBC', iv: new Uint8Array(16) }, k, b)).slice(0, 16);
}
async function deriveKey(s) {
  return aesBlock(await importKey(MASTER), new TextEncoder().encode(s + s));
}
async function ofb(data, iv) {
  const out = new Uint8Array(data.length);
  let fb = iv;
  for (let i = 0; i < data.length; i += 16) {
    fb = await aesBlock(keyObj, fb);
    for (let j = 0; j < 16 && i + j < data.length; j++) out[i + j] = data[i + j] ^ fb[j];
  }
  return out;
}

// ---- Encoding ----
const rawToF = r => r < 1986 ? Math.floor(r * 6 / 37) + 38 : Math.floor(r / 6) + 29;
const fToRaw = f => f < 360 ? Math.ceil((f - 38) * 37 / 6) : (f - 29) * 6;
function u64(bits) {
  let v = 0n;
  for (const b of bits) v |= 1n << BigInt(b);
  const a = new Uint8Array(8);
  new DataView(a.buffer).setBigUint64(0, v, true);
  return [...a];
}
function i32(v) {
  const a = new Uint8Array(4);
  new DataView(a.buffer).setInt32(0, v, true);
  return [...a];
}
function u16s(vals) {
  const a = new Uint8Array(vals.length * 2), d = new DataView(a.buffer);
  vals.forEach((v, i) => d.setUint16(i * 2, v, true));
  return [...a];
}

// ---- UI ----
function setConn(text, on) {
  $('conn').textContent = text;
  $('conn').classList.toggle('on', !!on);
  document.body.classList.toggle('connected', !!on);
  $('connect').textContent = on ? 'Disconnect' : 'Connect';
  $('connect').classList.toggle('secondary', !!on);
}
function setState(t) {
  const s = $('state');
  if (s.textContent === t) return;
  s.style.opacity = 0;
  setTimeout(() => { s.textContent = t; s.style.opacity = 1; }, 150);
}
function drawRing() {
  $('live').innerHTML = live == null ? '–' : `${live}<small>°</small>`;
  $('tgt').textContent = target ?? '–';
  const frac = live && target ? Math.min(1, Math.max(0, (live - 150) / (target - 150))) : 0;
  $('arc').style.strokeDashoffset = 603 * (1 - frac);
}
function showSetTemp(f) {
  $('temp').value = f;
  $('setv').textContent = f;
  document.querySelectorAll('#presets .chip').forEach(c => c.classList.toggle('active', +c.dataset.t === +f));
}
function showDev() {
  $('dev').hidden = !$('devmode').checked;
  renderLog();
  renderAttrs();
  syncPoll();
}
let toastTimer;
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
}
function renderBattery() {
  $('batt').textContent = (charging ? '⚡ ' : '🔋 ') + (battery ?? '–') + (battery == null ? '' : '%');
}

// ---- Session tracking ----
function trackState(s) {
  const now = Date.now(), prev = heatState;
  heatState = s;
  if ((s === 0 || s === 6) && !session.heatStart && !session.readyAt) session.heatStart = now;
  if ((s === 1 || s === 2) && !session.readyAt) {
    session.readyAt = now;
    session.draws = 0;
    session.heatSecs = session.heatStart ? Math.round((now - session.heatStart) / 1000) : null;
  }
  if (s === 2 && prev !== 2 && session.readyAt) session.draws++;
  if (s === 4 || s === 5) endSession();
  renderStats();
}
function endSession() {
  if (session.readyAt) session.lastMs = Date.now() - session.readyAt;
  session.readyAt = session.heatStart = null;
}
function renderStats() {
  const active = !!session.readyAt;
  $('sess').textContent = active ? fmtTime(Date.now() - session.readyAt) : session.lastMs ? fmtTime(session.lastMs) : '–';
  $('sessLbl').textContent = active || !session.lastMs ? 'Session' : 'Last session';
  $('sessStat').classList.toggle('live', active);
  $('heat').textContent = session.heatSecs != null ? session.heatSecs + 's' : '–';
  $('draws').textContent = session.readyAt || session.lastMs ? session.draws : '–';
}
setInterval(() => { if (session.readyAt) renderStats(); }, 1000);

// ---- Presets (press and hold to save) ----
function loadPresets() {
  try {
    const p = JSON.parse(store.get('paxPresets'));
    if (Array.isArray(p) && p.length === 4 && p.every(Number.isFinite)) return p;
  } catch {}
  return [...DEFAULT_PRESETS];
}
function renderPresets() {
  document.querySelectorAll('#presets .chip').forEach((c, i) => {
    c.dataset.t = presets[i];
    c.querySelector('b').textContent = presets[i] + '°';
  });
  showSetTemp($('temp').value);
}
function savePreset(i) {
  presets[i] = +$('temp').value;
  store.set('paxPresets', JSON.stringify(presets));
  renderPresets();
  const name = document.querySelectorAll('#presets .chip')[i].lastChild.textContent;
  toast(`Saved ${presets[i]}° to ${name}`);
}
function wirePreset(chip, i) {
  let timer = null, held = false;
  const cancel = () => { clearTimeout(timer); chip.classList.remove('saving'); };
  chip.addEventListener('pointerdown', () => {
    held = false;
    chip.classList.add('saving');
    timer = setTimeout(() => { held = true; chip.classList.remove('saving'); savePreset(i); }, 550);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => chip.addEventListener(ev, cancel));
  chip.addEventListener('contextmenu', e => e.preventDefault());
  chip.addEventListener('click', () => { if (held) { held = false; return; } setTemp(presets[i]); });
}

// ---- Attribute explorer ----
// Messages are padded with random bytes. Bytes that change on most messages are
// treated as padding; only the remaining "signal" bytes count as a real change.
const TICKING = new Set([1, 9]); // change on their own; never counted as a change
const LEN = { 1: 2, 2: 2, 3: 1, 6: 1, 7: 1, 9: 4, 17: 8, 19: 1, 21: 1, 23: 6, 24: 8, 31: 2, 32: 1 };
function isNoise(a, i) {
  if (LEN[a.id] != null) return i >= LEN[a.id];
  return a.cmp >= 2 && a.flips[i] / a.cmp > 0.6;
}
function recordAttr(id, pt) {
  const bytes = [...pt.slice(1)], now = Date.now();
  if (id !== 1) { pollStats.replies++; pollStats.lastAt = now; }
  let a = attrs[id];
  if (!a) a = attrs[id] = { id, bytes, cmp: 0, flips: bytes.map(() => 0), at: now, changedAt: now };
  else {
    let changed = false;
    a.cmp++;
    bytes.forEach((b, i) => {
      if (b === a.bytes[i]) return;
      a.flips[i]++;
      if (!isNoise(a, i)) changed = true;
    });
    a.bytes = bytes;
    a.at = now;
    if (changed && a.cmp >= 3 && !TICKING.has(id)) { a.changedAt = now; pollStats.changes++; } // need a few samples to tell padding from data
  }
  if (!attrsQueued && !$('dev').hidden) { attrsQueued = true; requestAnimationFrame(renderAttrs); }
}
function decodeAttr(id, b) {
  const u16 = i => b[i] | b[i + 1] << 8;
  if (id === 1 || id === 2 || id === 31) return `${rawToF(u16(0))}°F`;
  if (id === 3) return `${b[0]}%`;
  if (id === 9) { const t = b[0] | b[1] << 8 | b[2] << 16 | b[3] << 24; return `${Math.floor(t / 3600)}h ${Math.floor(t / 60) % 60}m ${t % 60}s`; }
  if (id === 17) return [0, 2, 4, 6].map(i => rawToF(u16(i)) + '°').join(' ');
  if (id === 24) {
    const ids = [];
    for (let i = 0; i < 64; i++) if (b[i >> 3] >> (i & 7) & 1) ids.push(i);
    return 'IDs ' + ids.join(', ');
  }
  if (id === 32) return (STATES[b[0]] || ['state ' + b[0]])[0];
  return '';
}
function attrHex(a) {
  let last = a.bytes.length - 1;
  while (last > 0 && isNoise(a, last)) last--;
  let zeros = 0; // collapse a long run of trailing 00s
  while (zeros <= last && a.bytes[last - zeros] === 0 && !isNoise(a, last - zeros)) zeros++;
  const keep = zeros > 4 ? last - zeros + 1 : last + 1;
  let shown = a.bytes.slice(0, keep).map((x, i) => isNoise(a, i) ? '··' : x.toString(16).padStart(2, '0')).join(' ');
  if (keep <= last) shown += ` 00×${zeros}`;
  return last < a.bytes.length - 1 ? shown + ' …' : shown;
}
function renderAttrs() {
  attrsQueued = false;
  if ($('dev').hidden) return;
  const now = Date.now();
  $('attrs').innerHTML = Object.keys(attrs).map(Number).sort((a, b) => a - b).map(id => {
    const a = attrs[id], [name, guess] = ATTRS[id] || ['Unknown', true], val = decodeAttr(id, a.bytes);
    const age = Math.round((now - a.at) / 1000);
    return `<tr class="${now - a.changedAt < 1500 ? 'changed' : ''}"><td>${id}</td>` +
      `<td><span class="${guess ? 'guess' : ''}">${name}${guess ? '?' : ''}</span>${val ? `<span class="hint">${val}</span>` : ''}</td>` +
      `<td>${attrHex(a)}</td><td>${age}s</td></tr>`;
  }).join('');
}
function attrsText() {
  return Object.keys(attrs).map(Number).sort((a, b) => a - b).map(id => {
    const a = attrs[id], name = (ATTRS[id] || ['Unknown'])[0], val = decodeAttr(id, a.bytes);
    return `${String(id).padStart(3)}  ${name.padEnd(20)} ${attrHex(a).padEnd(46)} ${val}`;
  }).join('\n');
}
async function copyResults() {
  const text = `ATTRIBUTES\n${attrsText()}\n\nLOG\n${lines.join('\n')}`;
  try { await navigator.clipboard.writeText(text); toast('Copied attributes + log'); }
  catch { toast('Copy failed — select the log text instead'); }
}
setInterval(renderAttrs, 1000);
function syncPoll() {
  const on = $('poll').checked && !$('dev').hidden;
  if (on && !pollTimer) {
    pollTimer = setInterval(() => send(254, u64(pollIds()), true), 2000);
    pollStats.replies = pollStats.changes = 0;
    log('Live poll on: only changes are logged; silence means nothing changed', true);
  }
  if (!on && pollTimer) { clearInterval(pollTimer); pollTimer = null; log('Live poll off', true); }
  renderPollStatus();
}
// Poll everything the device says it supports (attribute 24), not just the IDs the UI uses.
function pollIds() {
  const sup = attrs[24] && decodeAttr(24, attrs[24].bytes).slice(4).split(', ').map(Number);
  return sup?.length ? sup.filter(id => id !== 1) : [...BITS, 24, 26, 30];
}
function renderPollStatus() {
  const el = $('pollStatus');
  if (!pollTimer) { el.textContent = 'Off. Turn on, then move the device and watch which row lights up.'; return; }
  if (!wr) { el.textContent = '⚠️ Not connected'; return; }
  const ago = pollStats.lastAt ? Math.round((Date.now() - pollStats.lastAt) / 1000) : null;
  el.textContent = ago == null || ago > 5
    ? '⚠️ No replies' + (ago == null ? ' yet' : ` for ${ago}s`)
    : `🟢 Live · ${pollStats.replies} replies · ${pollStats.changes} changes`;
}
setInterval(renderPollStatus, 1000);

function showState() {
  if (heatState == null) return;
  const [text, cls] = STATES[heatState] || ['State ' + heatState, 'cool'];
  // Plugging in turns the oven off, so say why
  setState(charging && heatState === 5 ? 'Charging ⚡' : text);
  $('ring').className = 'ring ' + cls;
}

// ---- Device I/O ----
function handle(pt) {
  const id = pt[0], dv = new DataView(pt.buffer, pt.byteOffset), u16 = () => dv.getUint16(1, true);
  recordAttr(id, pt);
  if (id === 1) { live = rawToF(u16()); drawRing(); return; }
  if (!pollTimer || attrs[id].changedAt === attrs[id].at) log(`← ${id} [${attrHex(attrs[id])}] ${decodeAttr(id, attrs[id].bytes)}`);
  if (id === 2 && !dragging) showSetTemp(rawToF(u16()));
  if (id === 31) { target = rawToF(u16()); drawRing(); }
  if (id === 3) { battery = pt[1]; renderBattery(); }
  if (id === 7) { charging = pt[1] !== 0; renderBattery(); showState(); } // 01 = on charger (tested)
  if (id === 20 || id === 27) showTheme();
  if (id === 21 && pt[1] >= 5) $('bright').value = Math.round((pt[1] - 5) * 100 / 123);
  if (id === 32) {
    trackState(pt[1]);
    showState();
  }
}
function onNotify() {
  enqueue(async () => {
    if (!rd) return;
    const v = new Uint8Array((await rd.readValue()).buffer);
    handle(await ofb(v.slice(0, -16), v.slice(-16)));
  });
}
// With response, like the official app: it paces writes, and some stacks (Mac/Windows/Linux Chrome)
// drop the link on unacknowledged writes to this characteristic.
// Some stacks (Bluefy/iOS) reject every acknowledged write, so after the first failure we stay unacknowledged.
let noAck = false;
function writePkt(p) {
  if (noAck) return wr.writeValueWithoutResponse(p);
  return wr.writeValueWithResponse ? wr.writeValueWithResponse(p) : wr.writeValue(p);
}
function send(id, payload = [], quiet = false) {
  enqueue(async () => {
    if (!wr) return;
    const len = Math.ceil((1 + payload.length) / 16) * 16;
    const pt = crypto.getRandomValues(new Uint8Array(len));
    pt[0] = id;
    pt.set(payload, 1);
    const iv = crypto.getRandomValues(new Uint8Array(16));
    const pkt = new Uint8Array(len + 16);
    pkt.set(await ofb(pt, iv));
    pkt.set(iv, len);
    try { await writePkt(pkt); if (!quiet) log(`→ ${id} [${toHex(payload)}] ok`); }
    catch (e) {
      if (noAck || !wr?.properties.writeWithoutResponse || !wr.writeValueWithoutResponse) return log(`→ ${id} FAILED ${e}`);
      noAck = true;
      log(`Acknowledged write rejected (${e.message}); switching to write-without-response`);
      try { await wr.writeValueWithoutResponse(pkt); if (!quiet) log(`→ ${id} [${toHex(payload)}] ok`); }
      catch (e2) { log(`→ ${id} FAILED ${e2}`); }
    }
  });
}
function renderThemes() {
  $('themes').innerHTML = THEMES.map(([name, b], i) => {
    const c = b ? `linear-gradient(rgb(${b[16]},${b[17]},${b[18]}), rgb(${b[19]},${b[20]},${b[21]}))` : 'conic-gradient(#f44, #fd4, #4d6, #4af, #a6f, #f44)';
    return `<button class="chip" data-i="${i}"><span class="swatch" style="background:${c}"></span>${name}</button>`;
  }).join('');
  $('themes').querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const b = THEMES[c.dataset.i][1];
    if (b) send(20, [4, ...b]); else send(27, [0]);
    send(254, u64([20, 27])); // read back so the highlight reflects what the device accepted
  });
}
// Highlight the preset matching the device's current UI mode + theme (none if it's a custom theme).
function showTheme() {
  const mode = attrs[27]?.bytes[0], cur = attrs[20] && toHex(attrs[20].bytes.slice(1, 33));
  const i = mode === 0 ? 0 : mode === 1 && cur ? THEMES.findIndex(([, b]) => b && toHex(b) === cur) : -1;
  $('themes').querySelectorAll('.chip').forEach(c => c.classList.toggle('active', +c.dataset.i === i));
}
function applyMode() {
  send(19, [0]);
  send(25, u16s([...PROFILE, $('hold').checked ? 57 : 63]));
  send(21, [0, 2]);
}
function setTemp(f) {
  showSetTemp(f);
  send(2, i32(fToRaw(f)));
  send(254, u64([2, 31]));
}

// ---- Connection ----
async function connect() {
  const s = ($('serial').value || SERIAL).trim().toUpperCase();
  if (s.length !== 8) {
    $('devmode').checked = true;
    showDev();
    $('serial').focus();
    log('Enter your 8-character serial first');
    setState('Enter your serial in Developer mode');
    return;
  }
  keyObj = await importKey(await deriveKey(s));
  if (!device) {
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    device.addEventListener('gattserverdisconnected', onDisc);
  }
  want = true;
  setConn('Connecting…');
  setState('Connecting…');
  const svc = await (await device.gatt.connect()).getPrimaryService(SVC);
  rd = await svc.getCharacteristic(C_READ);
  wr = await svc.getCharacteristic(C_WRITE);
  const nt = await svc.getCharacteristic(C_NOTIFY);
  nt.oncharacteristicvaluechanged = onNotify;
  await nt.startNotifications();
  chain = Promise.resolve();
  noAck = false;
  retries = 0;
  setConn('Connected', true);
  log(`Connected to ${device.name}`);
  applyMode();
  send(254, u64(BITS));
}
function onDisc() {
  rd = wr = null;
  if (want && retries < 5) {
    retries++;
    setConn('Reconnecting…');
    log('Link dropped, retry ' + retries);
    setTimeout(() => connect().catch(e => { log('Retry failed: ' + e); onDisc(); }), 800 * retries);
  } else {
    $('ring').className = 'ring';
    endSession();
    renderStats();
    setConn('Offline');
    setState(want ? 'Lost connection — tap Connect' : 'Not connected');
    want = false;
  }
}

// ---- Wiring ----
$('connect').onclick = () => {
  if (wr) { want = false; device.gatt.disconnect(); return; }
  connect().catch(e => {
    want = false;
    log('Connect error: ' + e);
    setConn('Offline');
    setState(e.name === 'NotFoundError' ? 'Not connected' : 'Couldn’t connect — try again');
  });
};
$('temp').oninput = e => { dragging = true; showSetTemp(e.target.value); };
$('temp').onchange = e => { dragging = false; setTemp(+e.target.value); };
document.querySelectorAll('#presets .chip').forEach(wirePreset);
$('bright').onchange = e => send(21, [Math.round(5 + e.target.value * 123 / 100), 0]);
$('hold').checked = store.get('paxHold') !== '0';
$('hold').onchange = () => { store.set('paxHold', $('hold').checked ? '1' : '0'); applyMode(); };
$('devmode').onchange = showDev;
$('status').onclick = () => send(254, u64(BITS));
$('scan').onclick = () => send(254, u64(Array.from({ length: 40 }, (_, i) => i + 1)));
$('poll').onchange = syncPoll;
$('resetPresets').onclick = () => { presets = [...DEFAULT_PRESETS]; store.set('paxPresets', ''); renderPresets(); toast('Presets reset'); };
$('copy').onclick = copyResults;
$('mark').onclick = () => log(`──────── ${++marks} ────────`, true);
$('pause').onclick = () => {
  logPaused = !logPaused;
  $('pause').textContent = logPaused ? 'Resume' : 'Pause';
  $('pause').classList.toggle('active', logPaused);
};
$('clear').onclick = () => { lines.length = 0; marks = 0; renderLog(); };
$('serial').value = store.get('paxSerial') || SERIAL;
$('serial').oninput = e => store.set('paxSerial', e.target.value.trim().toUpperCase());

$('poll').checked = false; // browsers can restore checkbox state on reload without firing onchange
renderPresets();
renderThemes();
if (!navigator.bluetooth) {
  $('state').textContent = 'No Bluetooth here — on iPhone, use the Bluefy browser';
  $('connect').disabled = true;
} else if (!window.crypto?.subtle) {
  $('state').textContent = 'Open this over https or localhost';
  $('connect').disabled = true;
}
</script>
</body>
</html>
